  <rect x="120" y="440" width="580" height="60" rx="12" fill="#202226"/>
  <text x="150" y="478" fill="#969796" font-family="monospace" font-size="17">Hook contract: shared</text>
  <rect x="840" y="70" width="700" height="760" rx="24" fill="#1c1d1f"/>
  <rect x="840" y="70" width="700" height="56" rx="24 24 0 0" fill="#121417"/>
  <rect x="1050" y="70" width="280" height="56" rx="0 0 14 14" fill="#0a0b0d"/>
  <text x="876" y="105" fill="#eeeeeb" font-family="sans-serif" font-size="20">Windows</text>
  <rect x="900" y="180" width="580" height="520" rx="18" fill="#28292b"/>
  <circle cx="950" cy="230" r="16" fill="#c2501b"/>
  <text x="984" y="238" fill="#eeeeeb" font-family="sans-serif" font-size="22">Morrow</text>
  <rect x="900" y="280" width="580" height="60" rx="12" fill="#202226"/>
  <text x="930" y="318" fill="#969796" font-family="monospace" font-size="17">WinRT · SendKeys · named pipe</text>
  <rect x="900" y="360" width="580" height="60" rx="12" fill="#202226"/>
  <text x="930" y="398" fill="#969796" font-family="monospace" font-size="17">Capability: supported</text>
  <rect x="900" y="440" width="580" height="60" rx="12" fill="#202226"/>
  <text x="930" y="478" fill="#969796" font-family="monospace" font-size="17">Hook contract: shared</text>
  <text x="560" y="780" fill="#1c1d1f" font-family="sans-serif" font-size="22" text-anchor="middle">Same contract, three desktops</text>
