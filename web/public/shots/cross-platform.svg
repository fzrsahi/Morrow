  <rect x="120" y="280" width="580" height="60" rx="12" fill="#202226"/>
  <text x="150" y="318" fill="#969796" font-family="monospace" font-size="17">xdotool · xprop · playerctl</text>
  <rect x="120" y="360" width="580" height="60" rx="12" fill="#202226"/>
