<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="The same Morrow island on Linux and Windows">
  <rect width="1600" height="900" fill="#eeeeeb"/>
  <rect x="60" y="70" width="700" height="760" rx="24" fill="#1c1d1f"/>
  <rect x="60" y="70" width="700" height="56" rx="24 24 0 0" fill="#121417"/>
  <rect x="270" y="70" width="280" height="56" rx="0 0 14 14" fill="#0a0b0d"/>
  <text x="96" y="105" fill="#eeeeeb" font-family="sans-serif" font-size="20">Linux · X11</text>
  <rect x="120" y="180" width="580" height="520" rx="18" fill="#28292b"/>
