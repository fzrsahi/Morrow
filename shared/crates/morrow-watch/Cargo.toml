[package]
name = "morrow-watch"
description = "The OS-facing half of discovery: telling the shell that a store moved, instead of asking it. No policy — that lives in morrow-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Not core (GLOSSARY.md): this is an OS edge. Nothing here knows what a session is.
[dependencies]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    # `CreateFileW` and `CreateEventW` are gated behind Security in windows-sys,
    # because both take a `LPSECURITY_ATTRIBUTES` this arm always passes as null.
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[lints]
workspace = true
